<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WiseMoney | Login</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/auth.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="container">
      <div class="brand-hero page-fade">
        <img src="../assets/wisemoney logo.png" alt="WiseMoney" />
        <h1>WiseMoney</h1>
        <p>Premium insights for your money.</p>
      </div>

      <div class="auth-card card-glass page-fade">
        <h3 class="mb-3" style="font-weight:900; letter-spacing:.2px;">
          <i class="fa-solid fa-lock me-2" style="color:var(--brand-2);"></i>Login
        </h3>

        <div id="loginError" class="alert alert-danger" style="display:none; border-radius:14px; border:1px solid rgba(255,255,255,.12); margin-bottom:14px;"></div>
        <form id="loginForm">

          <div class="mb-3 field">
            <label class="form-label">Email</label>
            <input id="email" type="email" class="form-control" placeholder="you@example.com" required />
          </div>

          <div class="mb-4 field">
            <label class="form-label">Password</label>
            <input id="password" type="password" class="form-control" placeholder="••••••••" required />
          </div>

          <button class="btn btn-brand w-100 rounded-4" type="submit">
            <i class="fa-solid fa-arrow-right-to-bracket me-2"></i>
            Sign in
          </button>

          <div class="small-muted text-center mt-3">
            New here? <a href="register.html" style="color:rgba(255,255,255,.92); font-weight:800;">Create an account</a>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
